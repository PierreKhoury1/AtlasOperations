<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Contact – Northgate Plumbing</title>
<style>body{font-family:sans-serif;max-width:720px;margin:30px auto}label{display:block;margin-top:8px}#sent{color:green}</style></head>
<body>
<nav><a href="index.html">Home</a> <a href="prices.html">Prices</a></nav>
<h1>Contact us</h1>
<form id="contact" onsubmit="return send(event)">
  <label>Email <input id="email" name="email" type="email" placeholder="you@example.com"></label>
  <label>Message <textarea id="msg" name="message" rows="4" placeholder="How can we help?"></textarea></label>
  <button type="submit" id="sendbtn">Send message</button>
</form>
<p id="sent"></p>
<h2>Chat</h2>
<div id="composer" contenteditable="true" role="textbox" aria-label="Type a message" style="border:1px solid #999;min-height:24px;padding:4px"></div>
<div id="chatlog"></div>
<script>
function send(e){e.preventDefault(); document.getElementById('sent').textContent='Message sent to hello@northgate.example from '+document.getElementById('email').value+' · ticket #771'; return false;}
document.getElementById('composer').addEventListener('keydown', ev => { if (ev.key==='Enter' && !ev.shiftKey){ ev.preventDefault(); const t=ev.target.innerText.trim(); if(t){ const d=document.createElement('div'); d.className='bubble'; d.textContent='You: '+t; document.getElementById('chatlog').appendChild(d); ev.target.innerText=''; } } });
</script>
</body></html>
