<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas Review</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#1d1d1d;--area:#232323;--panel:#282828;--panel2:#303030;--head:#2b2b2b;--line:#161616;--edge:#3a3a3a;--text:#d4d4d4;--text2:#a8a8a8;--mute:#7c7c7c;
  --sel:#e8820d;--sel-soft:rgba(232,130,13,.16);--blue:#4a7fd1;--blue-soft:rgba(74,127,209,.18);--ok:#6cb36c;--bad:#d9534f;--warn:#d8a13c;--mono:"IBM Plex Mono",ui-monospace,monospace;--r:4px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font:12px/1.4 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;user-select:none}
button{font:inherit;color:inherit}
.app{display:grid;height:100vh;grid-template-rows:30px 1fr 150px;grid-template-columns:250px 1fr 300px;gap:2px;background:var(--line)}
/* ---- top bar */
.top{grid-column:1/-1;background:var(--head);display:flex;align-items:center;gap:2px;padding:0 8px;border-bottom:1px solid var(--line)}
.top .logo{display:flex;align-items:center;gap:7px;font-weight:600;padding-right:12px;color:#eee}
.top .logo i{width:14px;height:14px;border-radius:3px;background:linear-gradient(135deg,var(--sel),#c25a00);display:inline-block}
.top .ws{padding:5px 11px;border-radius:var(--r) var(--r) 0 0;color:var(--text2);cursor:pointer;align-self:flex-end;height:26px}
.top .ws.on{background:var(--bg);color:#fff}
.top .ws:hover:not(.on){color:#fff}
.top .sp{flex:1}
.top .chip{font-family:var(--mono);font-size:11px;color:var(--text2);background:var(--panel2);border:1px solid var(--edge);border-radius:var(--r);padding:2px 8px;margin-left:4px;white-space:nowrap}
.top .chip b{color:#fff;font-weight:500}
.top a{color:var(--text2);text-decoration:none;margin-left:10px}.top a:hover{color:#fff}
/* ---- panels */
.pane{background:var(--area);display:flex;flex-direction:column;min-height:0;min-width:0}
.ph{height:24px;display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--head);border-bottom:1px solid var(--line);color:var(--text2);font-size:11.5px;flex:0 0 auto}
.ph b{color:var(--text);font-weight:600}
.ph .sp{flex:1}
.pb{flex:1;overflow:auto;min-height:0}
.pb::-webkit-scrollbar{width:9px;height:9px}.pb::-webkit-scrollbar-thumb{background:#444;border-radius:5px;border:2px solid var(--area)}
/* ---- outliner */
.tree{padding:4px 0}
.row{display:flex;align-items:center;gap:6px;height:22px;padding:0 8px 0 calc(8px + var(--d,0) * 14px);cursor:pointer;white-space:nowrap}
.row:nth-child(even){background:rgba(255,255,255,.018)}
.row:hover{background:rgba(255,255,255,.05)}
.row.sel{background:var(--sel-soft);color:#fff}
.row .tw{width:10px;color:var(--mute);font-size:9px}
.row .sw{width:10px;height:10px;border-radius:2px;flex:0 0 auto}
.row .nm{flex:1 0 auto;min-width:64px;overflow:hidden;text-overflow:ellipsis}
.row .ct{overflow:hidden;text-overflow:ellipsis;min-width:0}
.row .ct{font-family:var(--mono);font-size:10.5px;color:var(--mute)}
.row .eye{width:16px;text-align:center;color:var(--text2);opacity:.9}
.row .eye.off{opacity:.3}
.row .ico{width:14px;text-align:center;color:var(--blue)}
/* ---- viewports */
.vp{background:var(--bg);display:grid;gap:2px;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);padding:0;min-height:0}
.vp.solo{grid-template-columns:1fr}
.vp.quad{grid-template-columns:repeat(2,minmax(0,1fr))}
.view{position:relative;background:#101010;min-height:0;overflow:hidden;outline:1px solid transparent;transition:outline-color .15s}
.view.hot{outline-color:var(--sel)}
.view canvas{width:100%;height:100%;display:block;cursor:crosshair}
.view .vh{position:absolute;left:0;right:0;top:0;height:22px;display:flex;align-items:center;gap:8px;padding:0 8px;background:linear-gradient(rgba(20,20,20,.88),rgba(20,20,20,.55));font-size:11px;pointer-events:none}
.view .vh b{color:#fff;font-weight:600}
.view .vh .m{font-family:var(--mono);color:var(--text2)}
.view .vh .sp{flex:1}
.view .vh .ok{color:var(--ok)}.view .vh .bad{color:var(--bad)}
.view.info{background:var(--area);padding:14px 16px;overflow:auto;grid-column:span 2}
.legend{display:grid;grid-template-columns:28px 1fr;gap:6px 8px;align-items:center;color:var(--text2);font-size:11.5px}
.legend svg{width:28px;height:14px}
.info h3{font-size:12px;color:#fff;margin:0 0 8px;font-weight:600}
.info p{color:var(--text2);margin:0 0 10px}
/* ---- properties */
.tabs{display:flex;flex-direction:column;gap:2px;padding:4px 3px;background:var(--head);border-right:1px solid var(--line)}
.tabs button{width:26px;height:26px;border:0;background:none;border-radius:var(--r);color:var(--mute);cursor:pointer;display:grid;place-items:center}
.tabs button.on{background:var(--panel2);color:var(--sel)}
.tabs button:hover{color:#fff}
.props{display:flex;min-height:0;flex:1}
.pc{flex:1;overflow:auto;padding:6px 0}
.sect{margin:0 6px 6px;background:var(--panel);border-radius:var(--r);overflow:hidden}
.sect .sh{display:flex;align-items:center;gap:6px;padding:5px 8px;font-weight:600;color:var(--text);cursor:pointer;background:var(--panel2)}
.sect .sh .tw{font-size:9px;color:var(--mute)}
.sect .sb{padding:6px 8px 8px}
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 10px;align-items:baseline}
.kv span{color:var(--text2)}
.kv b{font-family:var(--mono);font-weight:500;color:#fff;text-align:right}
.bar{height:5px;background:#1a1a1a;border-radius:3px;overflow:hidden;margin:2px 0 6px;grid-column:1/-1}
.bar i{display:block;height:100%;background:var(--blue)}
.bar.o i{background:var(--sel)}
.crops{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.crops div{background:#111;border-radius:3px;overflow:hidden;position:relative;aspect-ratio:1/2}
.crops canvas{width:100%;height:100%;display:block}
.crops span{position:absolute;left:3px;bottom:2px;font-family:var(--mono);font-size:10px;color:#fff;text-shadow:0 1px 2px #000}
.note{color:var(--mute);font-size:11px;padding:2px 0}
.agent{margin:0 6px 6px;background:var(--panel);border-radius:var(--r);padding:7px 8px;border-left:2px solid var(--edge)}
.agent h4{display:flex;gap:6px;align-items:baseline;font-size:11.5px;color:var(--text);margin-bottom:4px}.agent h4 span{color:var(--mute);font-weight:400;font-family:var(--mono);font-size:10.5px}
.agent .txt{color:var(--text2);font-size:11.5px;line-height:1.45;user-select:text;margin-bottom:5px}
.cl{display:flex;gap:5px;font-size:10.5px;line-height:1.35;padding:2px 0;color:var(--text2)}.cl i{flex:0 0 8px;height:8px;border-radius:2px;margin-top:3px}
.cl.supported i{background:var(--ok)}.cl.contradicted i{background:var(--bad)}.cl.unclear i{background:#666}.cl.contradicted{color:#f0b3b1}
.cl small{color:var(--mute)}
/* ---- timeline */
.tl{grid-column:1/-1;background:var(--area);display:grid;grid-template-rows:28px 1fr;min-height:0}
.tbar{display:flex;align-items:center;gap:4px;padding:0 8px;background:var(--head);border-bottom:1px solid var(--line)}
.tb{width:26px;height:22px;border:0;background:var(--panel2);border-radius:var(--r);cursor:pointer;color:var(--text);display:grid;place-items:center}
.tb:hover{background:#3b3b3b}
.tb.play{width:34px;background:var(--sel);color:#1a1a1a}
.tb.play:hover{background:#ff9624}
.fr{font-family:var(--mono);font-size:12px;background:#1a1a1a;border:1px solid var(--edge);border-radius:var(--r);padding:2px 8px;color:#fff;min-width:78px;text-align:center}
.tbar select{background:var(--panel2);border:1px solid var(--edge);color:var(--text);border-radius:var(--r);padding:2px 4px;font:inherit}
.tbar .sp{flex:1}
.tbar .lg{display:flex;gap:12px;color:var(--text2);font-size:11px;align-items:center}
.tbar .lg i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:5px}
.track{position:relative;min-height:0}
.track canvas{position:absolute;inset:0;width:100%;height:100%;cursor:ew-resize}
.empty{padding:24px;color:var(--text2)}
.empty code{font-family:var(--mono);color:#fff;background:#111;padding:1px 5px;border-radius:3px}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="top">
    <span class="logo"><i></i>Atlas</span>
    <span class="ws on">Review</span><a class="ws" href="/desk#cameras" style="margin:0">Cameras</a><a class="ws" href="/desk/objects" style="margin:0">Objects</a>
    <span class="sp"></span>
    <span class="chip" id="c-set">WILDTRACK · 7 cameras</span>
    <span class="chip" id="c-det">detection –</span>
    <span class="chip" id="c-trk">IDF1 –</span>
    <span class="chip" id="c-reid">re-id –</span>
  </div>

  <div class="pane">
    <div class="ph"><b>Outliner</b><span class="sp"></span><span id="o-n" class="ct"></span></div>
    <div class="pb"><div class="tree" id="tree"></div></div>
  </div>

  <div class="vp" id="vp"></div>

  <div class="pane">
    <div class="ph"><b id="p-title">Properties</b><span class="sp"></span></div>
    <div class="props">
      <div class="tabs" id="ptabs">
        <button class="on" data-t="scene" title="Scene"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M2 6h12"/></svg></button>
        <button data-t="person" title="Selected person"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="5" r="2.5"/><path d="M3 14c0-3 2.2-5 5-5s5 2 5 5"/></svg></button>
        <button data-t="agents" title="Camera agents: their notes, checked"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3h10v7H8l-3 3v-3H3z"/><path d="M6 6.5h4"/></svg></button>
        <button data-t="scores" title="Scores vs the labels"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 14V9M6 14V5M10 14V7M14 14V2"/></svg></button>
      </div>
      <div class="pc" id="pc"></div>
    </div>
  </div>

  <div class="tl">
    <div class="tbar">
      <button class="tb" onclick="seek(0)" title="Start (Home)">⏮</button>
      <button class="tb" onclick="step(-1)" title="Back one instant (←)">◀</button>
      <button class="tb play" id="play" onclick="toggle()" title="Play (Space)">▶</button>
      <button class="tb" onclick="step(1)" title="Forward one instant (→)">▶|</button>
      <button class="tb" onclick="seek(N-1)" title="End (End)">⏭</button>
      <span class="fr" id="fr">0 / 0</span>
      <span class="fr" id="tc" style="min-width:64px">0.0 s</span>
      <select id="spd" title="Playback speed"><option value="1">1×</option><option value="2" selected>2×</option><option value="4">4×</option><option value="8">8×</option></select>
      <span class="sp"></span>
      <span class="lg"><span><i style="background:#e0e0e0"></i>people in the scene (labels)</span><span><i style="background:var(--blue)"></i>sum of camera detections</span><span><i style="background:var(--warn)"></i>busiest camera</span><span id="lg-geo" style="display:none"><i style="background:var(--ok)"></i><span id="lg-geo-t">feet merged on the ground (75 cm)</span></span><span><i style="background:var(--sel);height:8px;width:3px"></i>selected person visible</span></span>
    </div>
    <div class="track"><canvas id="tlc"></canvas></div>
  </div>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let RV = null, RS = null, GEO = 'feet merged on the ground (75 cm)', SHARED = false, NT = null, N = 0, F = 0, playing = false, timer = null, SEL = null, SOLO = null, TAB = 'scene', SCRUB = false;
const HIDE = new Set();                                  // cameras hidden in the outliner
const IMG = {};                                           // `${cam}/${frame}` -> Image (preloaded ahead of the playhead)
const col = id => `hsl(${(id * 137.508) % 360} 72% 62%)`;
function img(cam, fi, hi){ const f = RV.instants[fi].frame, k = cam + '/' + f; let i = IMG[k];
  if (!i) { i = new Image(); i._fi = fi; i.fetchPriority = hi ? 'high' : 'low'; i.onload = () => { if (fi === F) drawViews(); }; i.src = `/api/review/frame/${cam}/${f}.jpg`; IMG[k] = i; }
  return i; }
function preload(fi, ahead = 8){
  // a fast scrub would queue hundreds of frames nobody will look at: drop the pending ones away from the playhead
  for (const [k, i] of Object.entries(IMG)) if (!i.complete && (i._fi < fi || i._fi > fi + ahead)) { i.onload = null; i.src = ''; delete IMG[k]; }
  RV.cameras.forEach(c => img(c, fi, true));
  for (let k = 1; k <= ahead; k++) { const j = fi + k; if (j >= N) break; RV.cameras.forEach(c => img(c, j)); }
  const keys = Object.keys(IMG); if (keys.length > 700) keys.slice(0, keys.length - 500).forEach(k => delete IMG[k]); }

async function init(){
  const r = await fetch('/api/review/data'); const j = await r.json();
  if (!r.ok) { $('#vp').innerHTML = `<div class="view info" style="grid-column:1/-1"><div class="empty">${esc(j.error || 'no data')}</div></div>`; return; }
  RV = j.review; RS = j.results; NT = j.notes; N = RV.instants.length;
  GEO = RV.geo_label || GEO; SHARED = !!RV.shared_ids; $('#lg-geo-t').textContent = GEO;   // older runs: the 75 cm clustering, per-camera ids
  if (RS) {
    const d = RS.detection && RS.detection[Object.keys(RS.detection)[0]];
    if (d) $('#c-det').innerHTML = `detection <b>P ${d.precision} · R ${d.recall}</b>`;
    const t = (RS.tracking || {})['ground tracker (all cameras)'] || RS.tracking && Object.values(RS.tracking)[1] || Object.values(RS.tracking || {})[0];
    const x = (RS.cross_camera || {})['ground tracker (all cameras)'];
    if (t) $('#c-trk').innerHTML = `IDF1 <b>${t.overall.idf1}</b> · switches <b>${t.overall.id_switches}</b>` + (x ? ` · across cameras <b>${x.idf1}</b>` : '');
    if (RS.reid && RS.reid.rank1 != null) $('#c-reid').innerHTML = `re-id rank-1 <b>${Math.round(RS.reid.rank1 * 100)}%</b>`;
    $('#c-set').innerHTML = `WILDTRACK · <b>${RV.cameras.length}</b> cameras · <b>${N}</b> instants · <b>${RS.identities}</b> people`;
  }
  buildViews(); seek(0); window.addEventListener('resize', () => { drawViews(); drawTimeline(); });
}
// ---------------------------------------------------------------- viewports
function buildViews(){
  const cams = RV.cameras.filter(c => !HIDE.has(c) && (!SOLO || SOLO === c)), quad = !SOLO && cams.length > 1 && cams.length <= 4;   // up to four views: a 2x2 grid, as large as they go
  const vp = $('#vp'); vp.className = 'vp' + (SOLO ? ' solo' : quad ? ' quad' : '');
  vp.innerHTML = cams.map(c => `<div class="view" id="v-${c}"><canvas id="cv-${c}"></canvas><div class="vh"><b>${c}</b><span class="m" id="vm-${c}"></span><span class="sp"></span><span class="m" id="vs-${c}"></span></div></div>`).join('')
    + (SOLO || quad ? '' : `<div class="view info"><h3>Reading the viewports</h3><p>All cameras show the same instant: one playhead drives every view, so what you compare is simultaneous.</p>
      <div class="legend"><svg><rect x="2" y="2" width="24" height="10" fill="none" stroke="#bbb" stroke-width="1.5"/></svg><span>human label (colour = person id, same on every camera)</span>
      <svg><rect x="2" y="2" width="24" height="10" fill="none" stroke="#bbb" stroke-width="1.5" stroke-dasharray="4 3"/></svg><span>${SHARED ? 'ground tracker (one id per person on every camera), matched to that label' : 'our tracker, matched to that label'}</span>
      <svg><rect x="2" y="2" width="24" height="10" fill="none" stroke="#d9534f" stroke-width="1.5" stroke-dasharray="4 3"/></svg><span>our tracker, no label there (false or unlabelled)</span>
      <svg><rect x="2" y="2" width="24" height="10" fill="rgba(217,83,79,.25)" stroke="#d9534f" stroke-width="1" stroke-opacity=".5"/></svg><span>labelled person we missed</span></div>
      <p style="margin-top:12px">Click anyone to follow them across all cameras. Double-click a view to maximise it. Space plays, ← → step.</p></div>`);
  cams.forEach(c => { const cv = $('#cv-' + c); cv.onclick = e => pick(c, e); cv.ondblclick = () => { SOLO = SOLO ? null : c; buildViews(); drawViews(); }; });
  drawViews();
}
function fit(cv){ const r = cv.getBoundingClientRect(), d = devicePixelRatio || 1; if (cv.width !== Math.round(r.width * d) || cv.height !== Math.round(r.height * d)) { cv.width = Math.round(r.width * d); cv.height = Math.round(r.height * d); } return d; }
function geom(cv){ const [W, H] = RV.size; const s = Math.min(cv.width / W, cv.height / H); return {s, ox: (cv.width - W * s) / 2, oy: (cv.height - H * s) / 2}; }
function drawViews(){
  if (!RV) return; const I = RV.instants[F];
  RV.cameras.forEach((c, ci) => {
    const cv = $('#cv-' + c); if (!cv) return; const d = fit(cv), x = cv.getContext('2d'), g = geom(cv), C = I.cams[ci];
    x.fillStyle = '#101010'; x.fillRect(0, 0, cv.width, cv.height);
    const im = img(c, F, true); if (im.complete && im.naturalWidth) x.drawImage(im, g.ox, g.oy, RV.size[0] * g.s, RV.size[1] * g.s);
    else { x.fillStyle = '#5a5a5a'; x.font = `${11 * d}px IBM Plex Mono`; x.fillText('loading frame…', g.ox + 8 * d, g.oy + 16 * d); }
    const B = b => [g.ox + b[0] * g.s, g.oy + b[1] * g.s, (b[2] - b[0]) * g.s, (b[3] - b[1]) * g.s];
    const matched = new Set(C.pred.filter(p => p[5] >= 0).map(p => p[5]));
    const dim = SEL != null;
    // labels
    C.gt.forEach(([pid, ...b]) => { const [bx, by, bw, bh] = B(b), on = SEL === pid, hit = matched.has(pid);
      x.globalAlpha = dim && !on ? .18 : 1;
      if (!hit) { x.fillStyle = 'rgba(217,83,79,.20)'; x.fillRect(bx, by, bw, bh); x.strokeStyle = 'rgba(217,83,79,.55)'; x.lineWidth = d; x.setLineDash([]); x.strokeRect(bx, by, bw, bh); }
      else { x.strokeStyle = col(pid); x.lineWidth = (on ? 2.5 : 1.3) * d; x.setLineDash([]); x.strokeRect(bx, by, bw, bh); }
      if (on || (!dim && bh > 40 * d)) { x.font = `${10 * d}px IBM Plex Mono`; const t = String(pid); x.fillStyle = on ? '#e8820d' : 'rgba(10,10,10,.75)'; x.fillRect(bx, by - 13 * d, x.measureText(t).width + 6 * d, 13 * d); x.fillStyle = on ? '#111' : col(pid); x.fillText(t, bx + 3 * d, by - 3 * d); } });
    // predictions
    C.pred.forEach(([tid, x1, y1, x2, y2, pid]) => { const [bx, by, bw, bh] = B([x1, y1, x2, y2]), on = SEL != null && SEL === pid;
      x.globalAlpha = dim && !on ? .18 : 1; x.setLineDash([4 * d, 3 * d]); x.lineWidth = (on ? 2 : 1.2) * d;
      x.strokeStyle = pid >= 0 ? col(pid) : '#d9534f'; x.strokeRect(bx + 2 * d, by + 2 * d, bw - 4 * d, bh - 4 * d);
      if (on) { x.setLineDash([]); x.font = `${9.5 * d}px IBM Plex Mono`; x.fillStyle = '#4a7fd1'; x.fillText((SHARED ? 'id ' : 'track ') + tid, bx + 3 * d, by + bh + 11 * d); } });
    x.globalAlpha = 1; x.setLineDash([]);
    const tp = C.pred.filter(p => p[5] >= 0).length, fp = C.pred.length - tp, fn = C.gt.length - matched.size;
    $('#vm-' + c).innerHTML = `${C.gt.length} labelled · ${C.pred.length} tracked`;
    $('#vs-' + c).innerHTML = `<span class="ok">${tp}✓</span> <span class="bad">${fp}✗ ${fn} missed</span>`;
    const v = $('#v-' + c); if (v) v.classList.toggle('hot', SEL != null && C.gt.some(g => g[0] === SEL));
  });
}
function pick(cam, e){
  const ci = RV.cameras.indexOf(cam), cv = $('#cv-' + cam), d = devicePixelRatio || 1, g = geom(cv), r = cv.getBoundingClientRect();
  const px = ((e.clientX - r.left) * d - g.ox) / g.s, py = ((e.clientY - r.top) * d - g.oy) / g.s;
  const C = RV.instants[F].cams[ci];
  const hits = C.gt.filter(([, x1, y1, x2, y2]) => px >= x1 && px <= x2 && py >= y1 && py <= y2).sort((a, b) => (a[3] - a[1]) * (a[4] - a[2]) - (b[3] - b[1]) * (b[4] - b[2]));
  const p = hits.length ? hits[0][0] : (C.pred.find(([, x1, y1, x2, y2]) => px >= x1 && px <= x2 && py >= y1 && py <= y2) || [])[5];
  select(p != null && p >= 0 ? p : null);
}
function select(pid){ SEL = pid; if (pid != null) setTab('person'); drawViews(); tree(); props(); drawTimeline(); }
// ---------------------------------------------------------------- outliner
function tree(){
  const I = RV.instants[F], people = new Map();
  I.cams.forEach((C, ci) => C.gt.forEach(([pid]) => { if (!people.has(pid)) people.set(pid, []); people.get(pid).push(RV.cameras[ci]); }));
  const ids = [...people.keys()].sort((a, b) => people.get(b).length - people.get(a).length || a - b);
  $('#o-n').textContent = ids.length + ' in scene';
  $('#tree').innerHTML = `<div class="row" style="--d:0"><span class="tw">▾</span><span class="ico">◧</span><span class="nm"><b>Scene</b> · instant ${F}</span><span class="ct">${I.scene} people</span></div>
    <div class="row" style="--d:1"><span class="tw">▾</span><span class="ico">⌖</span><span class="nm">Cameras</span><span class="ct">${RV.cameras.length}</span></div>`

    + `<div class="row" style="--d:1"><span class="tw">▾</span><span class="ico">☺</span><span class="nm">People (labelled)</span><span class="ct">${ids.length}</span></div>`

function solo(c){ SOLO = SOLO === c ? null : c; buildViews(); tree(); }
function hide(c){ HIDE.has(c) ? HIDE.delete(c) : HIDE.add(c); if (SOLO === c) SOLO = null; buildViews(); tree(); }
// ---------------------------------------------------------------- properties
function setTab(t){ TAB = t; document.querySelectorAll('#ptabs button').forEach(b => b.classList.toggle('on', b.dataset.t === t)); props(); }

const sect = (title, body, open = true) => `<div class="sect"><div class="sh" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === 'none' ? '' : 'none'"><span class="tw">${open ? '▾' : '▸'}</span>${title}</div><div class="sb" ${open ? '' : 'style="display:none"'}>${body}</div></div>`;

    const tids = new Set(); RV.instants.forEach(x => x.cams.forEach((C, ci) => C.pred.forEach(p => { if (p[5] === SEL) tids.add(SHARED ? p[0] : RV.cameras[ci] + ':' + p[0]); })));

      + sect('Across the recording', kv([['in view', `${(seen.length / 2).toFixed(1)} s`], ['first / last', seen.length ? `${seen[0].t.toFixed(1)} / ${seen.at(-1).t.toFixed(1)} s` : '–'],

      + (() => { const camsEver = new Set(); RV.instants.forEach(x => x.cams.forEach((C, ci) => { if (C.gt.some(g => g[0] === SEL)) camsEver.add(ci); }));

    where.forEach(w => { const cv = pc.querySelector(`canvas[data-c="${w.c}"]`), im = img(w.c, F), [, x1, y1, x2, y2] = w.g; const draw = () => { cv.width = 80; cv.height = 160; const x = cv.getContext('2d'); const bw = x2 - x1, bh = y2 - y1, s = Math.min(80 / bw, 160 / bh); x.fillStyle = '#111'; x.fillRect(0, 0, 80, 160); x.drawImage(im, x1, y1, bw, bh, (80 - bw * s) / 2, (160 - bh * s) / 2, bw * s, bh * s); }; im.complete ? draw() : im.addEventListener('load', draw, {once: true}); });
  } else {
    $('#p-title').textContent = 'Scores vs the labels';
    if (!RS) { pc.innerHTML = '<div class="note" style="padding:10px">No results.json</div>'; return; }
    const det = Object.entries(RS.detection || {}).map(([k, d]) => sect('Detection · ' + k, kv([['precision', d.precision, d.precision], ['recall', d.recall, d.recall], ['F1', d.f1, d.f1], ['count error / camera / frame', d.count_mae]]), !k.includes('0.3'))).join('');

    const xc = RS.cross_camera ? sect('Across cameras · one id per person', kv(Object.entries(RS.cross_camera).map(([k, v]) => [k, v.idf1, v.idf1]))
      + `<div class="note">IDF1 over all cameras at once: a person must keep the same id on every camera and over time. The ground tracker joins cameras by where the feet land.</div>`

// ---------------------------------------------------------------- timeline
function drawTimeline(){
  const cv = $('#tlc'); if (!cv || !RV) return; const d = fit(cv), x = cv.getContext('2d'), W = cv.width, H = cv.height, L = 34 * d, R = 10 * d, T = 10 * d, B = 18 * d;
  x.fillStyle = '#232323'; x.fillRect(0, 0, W, H);
  const sums = RV.instants.map(I => I.cams.reduce((a, C) => a + C.det, 0)), bigs = RV.instants.map(I => Math.max(...I.cams.map(C => C.det)));
  const top = Math.max(...sums, ...RV.instants.map(I => I.scene)) * 1.08;
  const X = i => L + (W - L - R) * i / Math.max(1, N - 1), Y = v => T + (H - T - B) * (1 - v / top);
  x.strokeStyle = '#303030'; x.lineWidth = d; x.font = `${9.5 * d}px IBM Plex Mono`; x.fillStyle = '#7c7c7c';
  for (let v = 0; v <= top; v += top > 120 ? 40 : 20) { x.beginPath(); x.moveTo(L, Y(v)); x.lineTo(W - R, Y(v)); x.stroke(); x.fillText(String(v), 4 * d, Y(v) + 3 * d); }
  for (let s = 0; s <= N / 2; s += 20) { const i = s * 2; x.fillText(s + 's', X(i) - 6 * d, H - 4 * d); x.beginPath(); x.moveTo(X(i), H - B); x.lineTo(X(i), H - B + 3 * d); x.stroke(); }
  if (SEL != null) { x.fillStyle = 'rgba(232,130,13,.55)'; RV.instants.forEach((I, i) => { if (I.cams.some(C => C.gt.some(g => g[0] === SEL))) x.fillRect(X(i) - d, H - B - 6 * d, Math.max(2 * d, X(1) - X(0)), 6 * d); }); }
  const line = (arr, c, w, dash) => { x.strokeStyle = c; x.lineWidth = w * d; x.setLineDash(dash ? dash.map(v => v * d) : []); x.beginPath(); arr.forEach((v, i) => i ? x.lineTo(X(i), Y(v)) : x.moveTo(X(i), Y(v))); x.stroke(); x.setLineDash([]); };
  line(bigs, '#d8a13c', 1.2); line(sums, '#4a7fd1', 1.4);
  if (RV.instants[0].geo != null) { line(RV.instants.map(I => I.geo), '#6cb36c', 1.4); $('#lg-geo').style.display = ''; }
  line(RV.instants.map(I => I.scene), '#e0e0e0', 1.8);
  if (NT) NT.instants.forEach(f => { const i = RV.instants.findIndex(I => I.frame === f); if (i < 0) return; const bad = NT.rows.some(r => r.frame === f && (r.check?.claims || []).some(c => c.own === 'contradicted')); x.fillStyle = bad ? '#d9534f' : '#6cb36c'; x.beginPath(); x.arc(X(i), T + 4 * d, 3.2 * d, 0, 7); x.fill(); });
  x.fillStyle = '#e8820d'; x.fillRect(X(F) - d, 0, 2 * d, H); x.beginPath(); x.moveTo(X(F) - 6 * d, 0); x.lineTo(X(F) + 6 * d, 0); x.lineTo(X(F), 8 * d); x.fill();
  const I = RV.instants[F]; x.font = `${10.5 * d}px IBM Plex Mono`; const label = `${I.scene} people · cams sum ${sums[F]} · busiest ${bigs[F]}${I.geo != null ? ' · ground ' + I.geo : ''}`; const tw = x.measureText(label).width + 10 * d;
  const lx = Math.min(W - R - tw, X(F) + 8 * d); x.fillStyle = 'rgba(20,20,20,.9)'; x.fillRect(lx, 10 * d, tw, 16 * d); x.fillStyle = '#fff'; x.fillText(label, lx + 5 * d, 22 * d);
}
(() => { const cv = $('#tlc'); let drag = false; const at = e => { const r = cv.getBoundingClientRect(), d = devicePixelRatio || 1, L = 34, R = 10; seek(Math.round((e.clientX - r.left - L) / (r.width - L - R) * (N - 1))); };
  cv.onmousedown = e => { drag = SCRUB = true; if (playing) toggle(); at(e); }; window.addEventListener('mousemove', e => drag && at(e));
  window.addEventListener('mouseup', () => { if (drag) { drag = SCRUB = false; preload(F); } }); })();
// ---------------------------------------------------------------- transport
function seek(i){ if (!RV) return; F = Math.max(0, Math.min(N - 1, i)); const I = RV.instants[F]; $('#fr').textContent = `${F} / ${N - 1}`; $('#tc').textContent = I.t.toFixed(1) + ' s'; preload(F, SCRUB ? 0 : 8); drawViews(); tree(); props(); drawTimeline(); }
function step(k){ if (playing) toggle(); seek(F + k); }
function toggle(){ playing = !playing; $('#play').textContent = playing ? '❚❚' : '▶'; clearInterval(timer); if (playing) timer = setInterval(() => { const next = (F + 1) % N; const ready = RV.cameras.every(c => HIDE.has(c) || img(c, next).complete); if (ready) seek(next); }, 500 / +$('#spd').value); }
$('#spd').onchange = () => { if (playing) { toggle(); toggle(); } };
document.addEventListener('keydown', e => { if (e.target.tagName === 'SELECT') return; if (e.code === 'Space') { e.preventDefault(); toggle(); } else if (e.key === 'ArrowRight') step(1); else if (e.key === 'ArrowLeft') step(-1); else if (e.key === 'Home') seek(0); else if (e.key === 'End') seek(N - 1); else if (e.key === 'Escape') select(null); });
init();
