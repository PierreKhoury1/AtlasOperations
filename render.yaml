services:
  - type: web
    name: atlas-ops
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 --threads 32 --timeout 120 -b 0.0.0.0:$PORT atlas.desk.app:app
    healthCheckPath: /api/health
    envVars:
      - key: DESK_MODE
        value: auto        # live as soon as OPENROUTER_API_KEY is set in the Render dashboard; scripted fallback otherwise
      - key: DESK_OPEN
        value: "1"
      - key: DESK_SECRET
        generateValue: true
      - key: DESK_TEMPLATE
        value: sales_desk
      - key: DEMO_DELAY
        value: "0.8"
      - key: PYTHON_VERSION
        value: "3.11.9"
