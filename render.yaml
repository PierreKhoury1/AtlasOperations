services:
  - type: web
    name: atlas-ops
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 --threads 32 --timeout 120 -b 0.0.0.0:$PORT atlas.desk.app:app
    healthCheckPath: /api/health
    envVars:
      - key: DESK_MODE
        value: live        # real models only. Without OPENROUTER_API_KEY the portal reports "no model key" - it never runs scripted agents.
      - key: OPENROUTER_API_KEY   # paste in the dashboard: Design Studio + every desk run on real models through OpenRouter
        sync: false
      - key: DESK_DEFAULT_ENGINE
        value: hermes_agent # every specialist runs on the Hermes Agent runtime when HERMES_AGENT_URL is set (built-in loop otherwise)
      - key: HERMES_AGENT_URL     # public URL of a running Hermes Agent API server (hermes gateway, API_SERVER_ENABLED=true), e.g. Tailscale Funnel / VPS
        sync: false
      - key: HERMES_AGENT_KEY     # that server's API_SERVER_KEY
        sync: false
      - key: DESK_OPEN
        value: "1"
      - key: DESK_SECRET
        generateValue: true
      - key: DESK_TEMPLATE
        value: sales_desk
      - key: DEMO_DELAY
        value: "0.8"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL     # postgres://... (Supabase / Render Postgres). Set in the dashboard; without it SQLite is wiped on every deploy.
        sync: false
      - key: VISION_DEMO_MODEL
        value: minimax/minimax-m3:free
      - key: VISION_DEMO_KEY  # OpenRouter key used only by the public site demos (narration + ask)
        sync: false
