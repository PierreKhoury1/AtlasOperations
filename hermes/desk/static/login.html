<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hermes Desk — sign in</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07030f;color:#f4f0ff;font-family:Quicksand,system-ui,sans-serif;font-weight:500;background-image:radial-gradient(55% 40% at 80% 0%,rgba(124,58,237,.30),transparent 70%),radial-gradient(40% 35% at 0% 60%,rgba(88,28,135,.22),transparent 70%);position:relative;overflow:hidden}
canvas{position:fixed;top:0;left:0;width:100%;height:55vh;pointer-events:none;opacity:.8;-webkit-mask-image:linear-gradient(to bottom,#000 40%,transparent);mask-image:linear-gradient(to bottom,#000 40%,transparent)}
form{position:relative;background:linear-gradient(160deg,rgba(30,16,64,.8),rgba(12,6,28,.85));border:1px solid rgba(168,85,247,.35);border-radius:22px;padding:34px;width:360px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 60px -20px rgba(139,92,246,.45),inset 0 1px 0 rgba(255,255,255,.08);backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;margin-bottom:4px}
.brand i{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#9b4dff,#6d28d9);position:relative;box-shadow:0 0 16px rgba(139,92,246,.45)}
.brand i::after{content:"";position:absolute;inset:7px;border-radius:50%;background:#0a0518}
p{color:#b7a9e3;font-size:13px;margin:0 0 20px}
input{width:100%;box-sizing:border-box;background:rgba(20,10,44,.8);border:1px solid rgba(168,85,247,.22);color:#fff;padding:13px 16px;border-radius:14px;font:inherit;margin-bottom:12px}
input:focus{outline:none;border-color:#c084fc;box-shadow:0 0 0 3px rgba(168,85,247,.18)}
button{width:100%;background:linear-gradient(135deg,#9b4dff,#6d28d9);color:#fff;border:0;padding:13px;border-radius:999px;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 8px 24px rgba(139,92,246,.45),inset 0 1px 0 rgba(255,255,255,.25)}
</style></head>
<body><canvas data-silk='{"ribbons":5,"alpha":.9}' aria-hidden="true"></canvas>
<form method="post"><div class="brand"><i></i>Hermes Desk</div><p>Client portal — sign in</p><input type="password" name="password" placeholder="Password" autofocus><button>Sign in</button></form>
<script src="/silk.js"></script></body></html>
